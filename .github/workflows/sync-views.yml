name: Sync views

# Frequent view sync via GitHub Actions cron. Vercel Hobby limits cron to once/day, so the
# fine-grained schedule lives here and just calls the protected sync endpoint. Runs every 15
# minutes; the Vercel cron (03:00) stays as a full-pass fallback.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-views
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger view sync
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PROD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PROD_URL or CRON_SECRET not set — skipping."
            exit 0
          fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PROD_URL/api/sync/views")
          echo "HTTP $code"
          cat /tmp/out.json || true
          if [ "$code" != "200" ]; then
            echo "Sync failed with HTTP $code"
            exit 1
          fi
