name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d reelpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reelpay_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/reelpay_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/reelpay_test?schema=reelpay_e2e
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      ANALYTICS_SALT: ci-analytics-salt-at-least-32-characters
      E2E_TEST: "1"
      DEMO_PAYMENTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
